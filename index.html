<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Total por Fornecedor / Produto</title>
<style>
:root{
  --bg:#0f1217; --bg2:#181d25; --bg3:#1d232d; --bg4:#141922;
  --border:#262d38; --text:#e6e9ee; --muted:#8a94a3;
  --accent:#4ea1ff; --accent-t:#04121f; --neg:#f5b942;
  --err:#ff6b6b; --ok:#3ecf8e;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}
.box{max-width:1100px;margin:0 auto}

h1{font-size:20px;margin:0 0 4px;line-height:1.2}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.sub b{color:var(--text);font-weight:600}

.card{
  background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; padding:12px; margin-bottom:12px;
}
.card h2{
  font-size:12px; margin:0 0 8px; color:var(--accent);
  text-transform:uppercase; letter-spacing:.05em; font-weight:700;
}

.r{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.r + .r{margin-top:8px}
.r.middle{align-items:center}

label{
  display:flex; flex-direction:column; gap:4px;
  font-size:12px; color:var(--muted); min-width:0;
}

input,button{
  background:#0c1015; color:var(--text);
  border:1px solid var(--border); border-radius:6px;
  padding:10px 12px; font:inherit; min-height:42px;
}
input[type=date]{color-scheme:dark;min-width:0}
input[type=checkbox]{
  min-height:0;width:18px;height:18px;padding:0;flex:0 0 auto;
  accent-color:var(--accent);cursor:pointer;
}
input:focus,button:focus{outline:2px solid var(--accent);outline-offset:1px}

button{
  background:var(--accent); color:var(--accent-t); border:0;
  font-weight:600; cursor:pointer; transition:filter .15s;
}
button:hover{filter:brightness(1.05)}
button:active{filter:brightness(.92)}

button.s{
  background:var(--border); color:var(--text); font-weight:500;
  padding:8px 12px; font-size:13px; min-height:38px;
}
button.s.on{background:var(--accent);color:var(--accent-t);font-weight:700}

.seg-label{
  color:var(--muted);font-size:12px;align-self:center;
  margin-right:4px;font-weight:600;
}

/* ===== Filtro de grupos (recolhível) ===== */
.gp{
  margin-top:8px;padding:10px;border:1px solid var(--border);
  border-radius:8px;background:var(--bg4);
}
.gp .r + .r{margin-top:8px}
.gp input#gq{flex:1;min-width:160px}
.gl{
  margin-top:8px;max-height:260px;overflow-y:auto;
  border:1px solid var(--border);border-radius:6px;background:#0c1015;
  -webkit-overflow-scrolling:touch;
}
label.gi{
  flex-direction:row;align-items:center;gap:10px;
  padding:8px 10px;border-bottom:1px solid var(--border);
  color:var(--text);font-size:13px;cursor:pointer;
}
label.gi:last-child{border-bottom:0}
label.gi:hover{background:#151b24}
label.gi.z{opacity:.5}
.gi .gn{flex:1;min-width:0;word-break:break-word}
.gi .gc{color:var(--muted);font-size:11.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.gempty{padding:12px;color:var(--muted);font-size:13px}
label.gs{
  flex-direction:row;align-items:center;gap:8px;
  color:var(--text);font-size:13px;cursor:pointer;margin-top:10px;
}

.k{
  display:grid; gap:8px; margin-bottom:12px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
}
.k > div{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px}
.k span{font-size:12px;color:var(--muted);display:block}
.k b{display:block;font-size:19px;color:var(--accent);margin-top:3px;font-variant-numeric:tabular-nums}

.w{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ===== Tabela principal ===== */
.tbl-main{width:100%;border-collapse:collapse}
.tbl-main th,.tbl-main td{
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
.tbl-main th{background:var(--bg3);font-weight:600;font-size:13px;color:#b8c0cc}
.tbl-main td.n,.tbl-main th.n{
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.tbl-main tfoot td{
  font-weight:700;border-top:2px solid var(--accent);border-bottom:0;
}

/* Linha grupo (fornecedor OU produto) */
tr.f{cursor:pointer}
tr.f:hover td{background:#1b212b}
tr.f td:first-child{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;
}
tr.f td:first-child .fname{word-break:break-word;min-width:0}

.cf{
  display:inline-block;
  background:#26303d; color:#8fbcf5;
  font-size:11px; padding:1px 7px; border-radius:4px;
  font-variant-numeric:tabular-nums; font-weight:600;
  flex:0 0 auto;
}
.a{display:inline-block;width:14px;color:var(--accent);flex:0 0 auto}
.gr-tag{color:var(--muted);font-size:11.5px;font-style:italic}

/* Linha NF (fornecedor) e linha NF-do-produto */
tr.d td{
  background:var(--bg4);font-size:13px;color:#c5ccd6;
  white-space:normal;line-height:1.45;
}
tr.d[data-n]{cursor:pointer}
tr.d[data-n]:hover td{background:#1a2130}

/* Subtotal por produto */
tr.sub td{
  background:#0d1219;font-size:13px;color:#9db4d6;font-weight:700;
  white-space:normal;border-top:1px dashed var(--accent);
}

/* Linha resumo NF */
tr.rs > td{
  background:#0f141b;padding:4px 12px 10px 32px;white-space:normal;
}

/* Linha itens */
tr.it > td{
  background:#0f141b;padding:10px 16px 16px 32px;white-space:normal;
}

.sum{
  margin:10px 0 0 auto;max-width:460px;font-size:13px;
  border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;background:var(--bg4);
}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:3px 0}
.sum span{color:var(--muted)}
.sum b{font-variant-numeric:tabular-nums}
.sum b.neg{color:var(--neg)}
.sum .tt{border-top:1px solid var(--accent);margin-top:4px;padding-top:6px;font-size:14px}
.sum .tt span{color:var(--text);font-weight:700}
.sum .tt b{color:var(--accent)}

/* ===== Tabela de itens ===== */
.items{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--border);
  border-radius:8px;
  background:#111721;
}
table.ii{
  width:100%;
  min-width:860px;
  border-collapse:collapse;
  font-size:12px;
}
table.ii th,table.ii td{
  padding:6px 8px;
  border-bottom:1px solid var(--border);
  text-align:left;
  vertical-align:top;
}
table.ii th{
  background:#1a2029;font-weight:600;font-size:11px;color:#b8c0cc;
  text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
}
table.ii td.n,table.ii th.n{
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
}
table.ii td.desc{
  white-space:normal;word-break:break-word;line-height:1.3;min-width:180px;
}
table.ii tbody tr:hover td{background:#151b24}
table.ii tbody tr:last-child td{border-bottom:0}
table.ii tfoot td{
  border-top:2px solid var(--accent);border-bottom:0;
  font-weight:700;background:#0f141b;white-space:nowrap;
}

/* ===== Ações / status ===== */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.actions .spacer{flex:1}

#st{color:var(--muted);font-size:12.5px;margin:6px 0}
#st.err{color:var(--err)}

#msg{
  position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px));
  left:50%; transform:translateX(-50%);
  background:var(--ok); color:var(--accent-t);
  padding:10px 16px; border-radius:8px; font-weight:600;
  display:none; z-index:100; max-width:calc(100vw - 32px);
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}

/* ===== Mobile ===== */
@media (max-width:720px){
  body{padding:12px;
     padding-top:calc(12px + env(safe-area-inset-top,0px));
     padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  h1{font-size:17px}
  .sub{font-size:12px}
  .card{padding:10px;border-radius:8px}
  label{flex:1 1 140px}
  label.wide{flex-basis:100%}
  label.gi,label.gs{flex:0 0 auto}
  .k > div{padding:8px}
  .k b{font-size:17px}

  .tbl-main th,.tbl-main td{padding:8px 9px;font-size:13.5px}
  tr.rs > td{padding:4px 8px 10px 16px}
  tr.it > td{padding:8px 8px 12px 8px}
  .sum{max-width:100%}

  /* ---- Itens viram cards no mobile ---- */
  .items{overflow:visible;border:0;border-radius:0;background:transparent}
  table.ii{min-width:0;display:block;width:100%;font-size:12.5px}
  table.ii thead{display:none}
  table.ii tbody,table.ii tfoot{display:block;width:100%}

  table.ii tbody tr{
    display:block;
    background:#141922;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
  }
  table.ii tbody tr:hover td{background:transparent}
  table.ii tbody td{
    display:flex;justify-content:space-between;gap:12px;
    padding:2px 0;border:0;
    white-space:normal;word-break:break-word;
    background:transparent !important;
  }
  table.ii tbody td::before{
    content:attr(data-label);
    color:var(--muted);font-size:11px;
    flex:0 0 auto;min-width:82px;
  }
  table.ii tbody td.desc{
    display:block;
    padding:0 0 6px;
    border-bottom:1px dashed var(--border);
    margin-bottom:6px;
    font-weight:600;color:#fff;font-size:13px;
    min-width:0;
  }
  table.ii tbody td.desc::before{
    display:block;
    font-size:10px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:2px;
  }
  table.ii tbody td.n::before{text-align:left}

  table.ii tfoot{
    display:block;
    background:#0f141b;
    border:1px solid var(--accent);
    border-radius:8px;
    padding:8px 10px;
    margin-top:4px;
  }
  table.ii tfoot tr{display:block}
  table.ii tfoot td{
    display:flex;justify-content:space-between;gap:12px;
    padding:2px 0;border:0;background:transparent;
    font-weight:600;white-space:normal;
  }
  table.ii tfoot td::before{
    content:attr(data-label);
    color:var(--muted);font-weight:500;font-size:11px;
  }
  table.ii tfoot td[data-label=""]::before{content:""}
}
@media (max-width:420px){
  .k{grid-template-columns:1fr 1fr}
}

/* =====================================================================
   IMPRESSÃO — layout de relatório corporativo
   ===================================================================== */
#printHeader{display:none}

@page{
  size:A4;
  margin:14mm 12mm 16mm;
  @bottom-left{
    content:"Sol Colchões · Relatório de Compras";
    font:8pt "Segoe UI",Arial,sans-serif; color:#666;
  }
  @bottom-right{
    content:"Página " counter(page) " de " counter(pages);
    font:8pt "Segoe UI",Arial,sans-serif; color:#666;
  }
}

@media print{
  :root{--pn:#1f3a5f; --pl:#e8edf4; --pz:#f6f8fb; --pb:#c9d1dc}

  html,body{
    background:#fff !important; color:#111 !important;
    padding:0 !important; margin:0 !important;
    font:10pt/1.35 "Segoe UI",Arial,Helvetica,sans-serif;
  }
  *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    box-shadow:none !important; text-shadow:none !important;
  }
  .box{max-width:none;margin:0}
  .no-print,input,button,#msg,#st{display:none !important}
  .card{background:transparent !important;border:0 !important;padding:0 !important;margin:0 !important}
  .w{overflow:visible !important}

  /* ---- Cabeçalho do relatório ---- */
  #printHeader{display:block !important;margin-bottom:10px}
  #printHeader .ph-top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2.5px solid var(--pn);padding-bottom:6px;
  }
  #printHeader .ph-brand{
    font-size:15pt;font-weight:800;letter-spacing:.08em;color:var(--pn);
  }
  #printHeader .ph-brand small{
    display:block;font-size:7.5pt;font-weight:600;letter-spacing:.12em;
    color:#666;margin-top:1px;
  }
  #printHeader .ph-doc{text-align:right;font-size:8pt;color:#555;line-height:1.5}
  #printHeader .ph-doc b{color:#111;font-size:8.5pt}
  #printHeader h1{
    font-size:14pt;margin:10px 0 8px;color:#111;font-weight:700;
  }
  #printHeader .ph-meta{
    display:grid;grid-template-columns:repeat(4,1fr);
    border:1px solid var(--pb);border-radius:3px;overflow:hidden;
  }
  #printHeader .ph-meta > div{
    padding:5px 8px;border-right:1px solid var(--pb);border-bottom:1px solid var(--pb);
    background:var(--pz);
  }
  #printHeader .ph-meta > div.wide{grid-column:span 2}
  #printHeader .ph-meta > div.full{grid-column:1 / -1}
  #printHeader .ph-meta span{
    display:block;font-size:6.5pt;text-transform:uppercase;letter-spacing:.06em;
    color:#666;font-weight:600;
  }
  #printHeader .ph-meta b{
    display:block;font-size:9.5pt;color:#111;font-variant-numeric:tabular-nums;
    margin-top:1px;
  }
  #printHeader .ph-meta > div.hl{background:var(--pn)}
  #printHeader .ph-meta > div.hl span{color:#c8d4e6}
  #printHeader .ph-meta > div.hl b{color:#fff;font-size:11pt}

  /* KPIs da tela já estão no cabeçalho */
  .k{display:none !important}

  /* ---- Tabela principal ---- */
  .tbl-main{width:100%;border-collapse:collapse;font-size:9.5pt}
  .tbl-main thead{display:table-header-group}
  .tbl-main tfoot{display:table-row-group}
  .tbl-main th{
    background:var(--pn) !important;color:#fff !important;
    font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:6px 8px !important;border:0 !important;
  }
  .tbl-main td{
    padding:5px 8px !important;color:#111 !important;
    border-bottom:1px solid #dde3ec !important;
    white-space:normal !important;
  }
  .tbl-main td.n,.tbl-main th.n{text-align:right;white-space:nowrap !important}

  .a{display:none !important}

  tr.f td{
    background:var(--pl) !important;font-weight:700;
    border-top:1px solid var(--pb) !important;
    border-bottom:1px solid var(--pb) !important;
    padding-top:6px !important;padding-bottom:6px !important;
  }
  tr.f td:first-child{display:table-cell !important}
  tr.f td:first-child .fname{font-size:10pt}
  .cf{
    background:#fff !important;color:var(--pn) !important;
    border:1px solid var(--pn) !important;border-radius:3px;
    font-size:7.5pt;padding:0 5px;margin-right:6px;font-weight:700;
  }
  .gr-tag{color:#555 !important;font-weight:400;font-size:8pt}

  tr.d td{
    background:#fff !important;font-size:8.5pt;color:#222 !important;
    padding-left:22px !important;
  }
  tr.d td b{color:#000}
  tr.sub td{
    background:var(--pz) !important;color:#000 !important;
    border-top:1.5px solid var(--pn) !important;font-weight:700;font-size:9pt;
    padding-left:22px !important;
  }
  tr.rs > td{background:#fff !important;padding:2px 8px 8px 22px !important}
  tr.it > td{background:#fff !important;padding:2px 8px 10px 22px !important}

  tr.f,tr.d,tr.rs,tr.sub{break-inside:avoid;page-break-inside:avoid}
  tr.f{break-after:avoid;page-break-after:avoid}

  .tbl-main tfoot td{
    background:var(--pn) !important;color:#fff !important;
    font-weight:700;font-size:10pt;border:0 !important;
    padding:7px 8px !important;
  }

  /* ---- Conciliação da NF ---- */
  .sum{
    margin:2px 0 0 auto !important;max-width:300px !important;
    background:#fff !important;border:1px solid var(--pb) !important;
    border-radius:3px;padding:3px 8px !important;font-size:8pt !important;
    color:#111 !important;
  }
  .sum div{padding:1px 0 !important}
  .sum span{color:#555 !important}
  .sum b{color:#111 !important}
  .sum b.neg{color:#8a5a00 !important}
  .sum .tt{border-top:1px solid #333 !important;margin-top:2px !important;padding-top:3px !important;font-size:8.5pt !important}
  .sum .tt span,.sum .tt b{color:#000 !important;font-weight:700}
  #tf .sum{max-width:340px !important;margin:8px 0 0 auto !important;font-size:9pt !important}

  /* ---- Tabela de itens ---- */
  .items{
    overflow:visible !important;border:1px solid var(--pb) !important;
    border-radius:3px !important;background:#fff !important;
  }
  table.ii{
    display:table !important;width:100% !important;min-width:0 !important;
    font-size:7.5pt !important;border-collapse:collapse;
  }
  table.ii thead{display:table-header-group !important}
  table.ii tbody{display:table-row-group !important}
  table.ii tfoot{
    display:table-row-group !important;background:transparent !important;
    border:0 !important;padding:0 !important;margin:0 !important;border-radius:0 !important;
  }
  table.ii tr{display:table-row !important}
  table.ii th,table.ii td{display:table-cell !important}
  table.ii tbody tr,table.ii tfoot tr{
    background:transparent !important;border:0 !important;border-radius:0 !important;
    padding:0 !important;margin:0 !important;
    break-inside:avoid;page-break-inside:avoid;
  }
  table.ii tbody tr:nth-child(even) td{background:var(--pz) !important}
  table.ii th{
    background:var(--pl) !important;color:#111 !important;
    font-size:6.5pt !important;padding:3px 5px !important;
    border-bottom:1px solid #999 !important;
  }
  table.ii td{
    padding:2px 5px !important;color:#111 !important;
    border:0 !important;border-bottom:1px solid #e3e7ee !important;
    white-space:nowrap !important;font-weight:400 !important;
    font-size:7.5pt !important;justify-content:initial !important;
  }
  table.ii td::before,table.ii th::before{display:none !important;content:none !important}
  table.ii td.desc{
    white-space:normal !important;word-break:break-word;min-width:0 !important;
    border-bottom:1px solid #e3e7ee !important;margin:0 !important;
    color:#111 !important;font-size:7.5pt !important;
  }
  table.ii td.n,table.ii th.n{text-align:right !important}
  table.ii tfoot td{
    background:var(--pl) !important;border-top:1px solid #555 !important;
    border-bottom:0 !important;font-weight:700 !important;
  }
}
</style>
</head>
<body>
<div class="box">

  <div id="printHeader">
    <div class="ph-top">
      <div class="ph-brand">SOL COLCHÕES<small>SETOR FISCAL · COMPRAS</small></div>
      <div class="ph-doc"><b>Relatório de Compras</b><br><span id="phDate"></span></div>
    </div>
    <h1 id="phTitle">Total das notas por fornecedor</h1>
    <div class="ph-meta" id="phMeta"></div>
  </div>

  <h1 class="no-print">Total das notas por fornecedor / produto</h1>
  <div class="sub no-print">Dados do Google Sheets · filtro pela <b>Data de Entrada no Sistema</b></div>

  <div class="card no-print">
    <h2>Filtros</h2>

    <div class="r middle">
      <span class="seg-label">Agrupar por:</span>
      <button class="s on" data-g="fornecedor">Fornecedor</button>
      <button class="s" data-g="produto">Produto</button>
    </div>

    <div class="r">
      <button class="s" data-p="hoje">Hoje</button>
      <button class="s" data-p="7">7 dias</button>
      <button class="s" data-p="30">30 dias</button>
      <button class="s" data-p="mes">Mês atual</button>
      <button class="s" data-p="mesant">Mês anterior</button>
      <button class="s" data-p="tudo">Tudo</button>
    </div>

    <div class="r">
      <label>Entrada de<input type="date" id="d1"></label>
      <label>Entrada até<input type="date" id="d2"></label>
      <label class="wide" style="flex:1;min-width:200px">Fornecedor, NF ou produto<input id="q" placeholder="Filtrar..."></label>
      <button id="rf">↻ Atualizar</button>
    </div>

    <div class="r middle">
      <button class="s" id="gb" aria-expanded="false" aria-controls="gp">Grupos: Todos ▾</button>
    </div>

    <div class="gp" id="gp" hidden>
      <div class="r middle" id="gpre"><span class="seg-label">Predefinidos:</span></div>
      <div class="r middle">
        <input id="gq" placeholder="Buscar grupo ou código..." autocomplete="off">
        <button class="s" id="gAll" title="Marca os grupos visíveis na lista">Marcar</button>
        <button class="s" id="gNone" title="Desmarca os grupos visíveis na lista">Desmarcar</button>
        <button class="s" id="gInv" title="Inverte os grupos visíveis na lista">Inverter</button>
      </div>
      <div class="gl" id="gl"></div>
      <label class="gs"><input type="checkbox" id="gSave"> Lembrar esta seleção nas próximas consultas</label>
    </div>
  </div>

  <div id="st">Carregando...</div>
  <div class="k" id="k"></div>

  <div class="card w" style="padding:0">
    <table class="tbl-main">
      <thead id="thead"></thead>
      <tbody id="tb"></tbody>
      <tfoot id="tf"></tfoot>
    </table>
  </div>

  <div class="actions no-print">
    <button class="s" id="ea">Expandir todos</button>
    <button class="s" id="ca">Recolher todos</button>
    <span class="spacer"></span>
    <button class="s" id="pc">🖨 Imprimir com detalhamento</button>
    <button class="s" id="ps">🖨 Imprimir sem detalhamento</button>
  </div>

  <div id="msg"></div>
</div>

<script>
/* ====== CONFIG ====== */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4EIhTGYnvS8KrgGfYr0ujcE1XmFr2yVC_gPuzJSqIsEcusoCoaYR2BHrkBT8dJAketaDTFf6vGzI3/pub?output=csv';
const DEFAULT_PRESET = '30';      // hoje | 7 | 30 | mes | mesant | tudo
const DEFAULT_GROUP = 'fornecedor'; // fornecedor | produto
const GKEY = 'nfs.filtroGrupos.v1'; // chave do localStorage (grupos salvos)
const SEM_GRUPO = '(Sem grupo)';
/* Predefinidos de grupos (por Codigo_Grupo). Para criar outro, basta adicionar uma linha. */
const GRUPO_PRESETS = {
  'Matéria prima': ['1','2','3','4','7','8','10','11','12','13','15','16','31','40','41','53']
};
/* ==================== */

const $ = i => document.getElementById(i);
const R = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N3 = v => v.toLocaleString('pt-BR',{maximumFractionDigits:4});
const r2 = v => Math.round(v*100)/100;

const num = s => {
  s = String(s==null?'0':s).trim();
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  return parseFloat(s) || 0;
};
const iso = d => {
  const p = (d||'').trim().split('/');
  return p.length===3 ? `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}` : '';
};
const fmtIso = i => i ? i.split('-').reverse().join('/') : '';
const ymd = d => {
  const z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gName = x => x.gr || SEM_GRUPO;

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; }
      else f+=c;
    } else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=''; }
    else if(c=='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}

let nfs=[], groups=[];
let groupMode = DEFAULT_GROUP;
const open=new Set(), openNF=new Set();

/* ====== Filtro de grupos ======
   selG === null  -> todos os grupos (sem filtro)
   selG === Set   -> apenas os grupos do Set                     */
let selG = null;
let saveG = false;
let allGroups = [];
let gView = [];
let gCode = {};   // nome do grupo -> Codigo_Grupo

function loadG(){
  try{
    const j = JSON.parse(localStorage.getItem(GKEY) || 'null');
    if(j){
      saveG = true;
      selG = Array.isArray(j.sel) ? new Set(j.sel) : null;
    }
  }catch(e){}
}
function persistG(){
  try{
    if(saveG) localStorage.setItem(GKEY, JSON.stringify({sel: selG ? [...selG] : null}));
    else localStorage.removeItem(GKEY);
  }catch(e){}
}
const curG = () => new Set(selG || allGroups);
const normCode = c => { c = String(c||'').trim(); return /^\d+$/.test(c) ? String(parseInt(c,10)) : c.toLowerCase(); };
const presetNames = codes => {
  const cs = new Set(codes.map(normCode));
  return allGroups.filter(g => gCode[g] && cs.has(normCode(gCode[g])));
};
function activePreset(){
  if(!selG) return '';
  for(const [nome, codes] of Object.entries(GRUPO_PRESETS)){
    const a = presetNames(codes);
    if(a.length && a.length === selG.size && a.every(g => selG.has(g))) return nome;
  }
  return '';
}
function applyPreset(nome){
  const codes = GRUPO_PRESETS[nome];
  if(!codes) return;
  const names = presetNames(codes);
  if(!names.length){ toast('Nenhum grupo desse predefinido foi encontrado na planilha'); return; }
  const found = new Set(names.map(g => normCode(gCode[g])));
  const falta = codes.filter(c => !found.has(normCode(c)));
  setSel(new Set(names));
  toast(`${nome}: ${names.length} grupo(s)` + (falta.length ? ` · sem movimento/não achei: ${falta.join(', ')}` : ''));
}
function setSel(set){
  selG = (allGroups.length && allGroups.every(g => set.has(g))) ? null : set;
  persistG();
  draw();
}
const gCount = () => selG ? allGroups.filter(g => selG.has(g)).length : allGroups.length;

/* Texto dos grupos filtrados para o cabeçalho de impressão */
function gTxt(){
  if(!selG) return 'Todos os grupos';
  const ap = activePreset();
  const a = allGroups.filter(g => selG.has(g)).map(g => gCode[g] ? `${gCode[g]} ${g}` : g);
  if(!a.length) return 'Nenhum';
  const lista = a.slice(0,8).join(', ') + (a.length>8 ? ` (+${a.length-8})` : '');
  return ap ? `${ap} — ${lista}` : lista;
}

/* Monta o cabeçalho de impressão (grade de informações) */
function setPrintMeta(agrup, periodo, cells, q){
  const dt = new Date();
  const pd = $('phDate');
  if(pd) pd.textContent = 'Emitido em ' + dt.toLocaleDateString('pt-BR') + ' às ' +
    dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const c = (l,v,cls) => `<div class="${cls||''}"><span>${l}</span><b>${esc(v)}</b></div>`;
  let h = c('Agrupamento', agrup) + c('Período (data de entrada)', periodo, 'wide');
  cells.forEach(x => { h += c(x[0], x[1], x[2]); });
  h += c('Grupos de produto', gTxt(), 'full');
  if(q) h += c('Filtro de busca', q, 'full');
  const ph = $('phMeta');
  if(ph) ph.innerHTML = h;
}

/* Aplica o filtro de grupos numa NF. Se só parte dos itens entra, recalcula o valor. */
function applyG(n){
  if(!selG) return n;
  const its = n.it.filter(x => selG.has(gName(x)));
  if(!its.length) return null;
  if(its.length === n.it.length) return n;
  const s = k => its.reduce((a,x)=>a+x[k],0);
  return Object.assign({}, n, {
    it: its,
    v: r2(s('vt') + s('ipi') + s('fr') - s('dc')),
    dn: r2(s('dc')),
    parcial: true
  });
}

function build(rows){
  const h = rows[0].map(x=>x.trim());
  const i = n => h.indexOf(n);
  const seen = {};
  nfs = [];
  const C = {
    f:i('Nome_Fornecedor'), cf:i('Cod_Fornecedor'), ped:i('Pedido_Compra'),
    nf:i('Numero_NF'), s:i('Serie'), em:i('Data_Emissao_Nota'),
    en:i('Data_Entrada_Sistema'), v:i('Valor_Total_Nota_Geral'),
    ch:i('Chave_Acesso_NFe'), cod:i('Codigo_Produto'), desc:i('Descricao_Produto'),
    un:i('Unidade_Medida'), gr:i('Descricao_Grupo'), cfop:i('CFOP_Item'),
    qtd:i('Quantidade'), vu:i('Valor_Unitario'), vt:i('Valor_Total_Produtos_Item'),
    fr:i('Valor_Frete_Item'), dc:i('Valor_Desconto_Rateado_Item'),
    liq:i('Valor_Liquido_Item'), icms:i('Valor_ICMS_Item'),
    ipi:i('Valor_IPI_Item'), dnf:i('Valor_Desconto_Total_Nota')
  };
  const cgI = i('Codigo_Grupo');
  if(Object.values(C).some(x=>x<0)) throw new Error('Colunas não encontradas na planilha. Confira o cabeçalho.');

  rows.slice(1).forEach(r=>{
    if(r.length < h.length-2) return;
    const g = k => (r[C[k]]||'').trim();
    if(!g('nf')) return;

    const key = g('cf')+'|'+g('nf')+'|'+g('s')+'|'+g('ch');
    const it = {
      cod:g('cod'), desc:g('desc'), un:g('un'), gr:g('gr'), cg:(cgI>=0 ? (r[cgI]||'').trim() : ''), cfop:g('cfop'),
      qtd:num(g('qtd')), vu:num(g('vu')), vt:num(g('vt')),
      fr:num(g('fr')), dc:num(g('dc')), liq:num(g('liq')),
      icms:num(g('icms')), ipi:num(g('ipi'))
    };
    if(seen[key]){ seen[key].it.push(it); return; }

    const ch = g('ch');
    const o = {
      key, idx:nfs.length,
      cf: g('cf'),
      f:  g('f'),
      ped:g('ped'), nf:g('nf'), s:g('s'), em:g('em'),
      en:g('en'), eni:iso(g('en')), v:num(g('v')), dn:num(g('dnf')),
      ch:/^\d{44}$/.test(ch)?ch:'', it:[it]
    };
    seen[key]=o; nfs.push(o);
  });

  const gs = new Set();
  gCode = {};
  nfs.forEach(n => n.it.forEach(x => { const k = gName(x); gs.add(k); if(x.cg && !gCode[k]) gCode[k] = x.cg; }));
  allGroups = [...gs].sort((a,b)=>{
    const ca = gCode[a] || '', cb = gCode[b] || '';
    if(ca && !cb) return -1;          // grupos sem código vão para o fim
    if(!ca && cb) return 1;
    return ca.localeCompare(cb,'pt-BR',{numeric:true}) || a.localeCompare(b,'pt-BR');
  });
}

function itemsHTML(n){
  const s = k => n.it.reduce((a,x)=>a+x[k],0);
  const ipi = s('ipi'), liq = s('liq');
  const rows = n.it.map(x=>`<tr>
    <td data-label="Cód.">${esc(x.cod)}</td>
    <td data-label="Produto" class="desc">${esc(x.desc)}</td>
    <td data-label="Grupo">${x.cg ? esc(x.cg)+' · ' : ''}${esc(x.gr)}</td>
    <td data-label="CFOP">${esc(x.cfop)}</td>
    <td data-label="UN">${esc(x.un)}</td>
    <td data-label="Qtd" class="n">${N3(x.qtd)}</td>
    <td data-label="V. Unit." class="n">${R(x.vu)}</td>
    <td data-label="Total prod." class="n">${R(x.vt)}</td>
    <td data-label="Frete" class="n">${R(x.fr)}</td>
    <td data-label="Desc. rat." class="n">${R(x.dc)}</td>
    <td data-label="Líquido" class="n">${R(x.liq)}</td>
    <td data-label="ICMS" class="n">${R(x.icms)}</td>
    <td data-label="IPI" class="n">${R(x.ipi)}</td>
  </tr>`).join('');

  return `<div class="items"><table class="ii">
    <thead><tr>
      <th>Cód.</th><th>Produto</th><th>Grupo</th><th>CFOP</th><th>UN</th>
      <th class="n">Qtd</th><th class="n">V. Unit.</th><th class="n">Total prod.</th>
      <th class="n">Frete</th><th class="n">Desc. rat.</th><th class="n">Líquido</th>
      <th class="n">ICMS</th><th class="n">IPI</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr>
      <td colspan="7" data-label="">${n.it.length} item(ns)</td>
      <td class="n" data-label="Total prod.">${R(s('vt'))}</td>
      <td class="n" data-label="Frete">${R(s('fr'))}</td>
      <td class="n" data-label="Desc. rat.">${R(s('dc'))}</td>
      <td class="n" data-label="Líquido">${R(liq)}</td>
      <td class="n" data-label="ICMS">${R(s('icms'))}</td>
      <td class="n" data-label="IPI">${R(ipi)}</td>
    </tr></tfoot>
  </table></div>`;
}

function resumo(n){
  const s = k => n.it.reduce((a,x)=>a+x[k],0);
  const prod = r2(s('vt')), ipi = r2(s('ipi')), fr = r2(s('fr')), dn = r2(n.dn);
  const out = r2(n.v - (prod + ipi + fr - dn));
  const L = [['Total dos produtos', prod, '']];
  L.push(['+ Total IPI', ipi, '']);
  if(fr) L.push(['+ Frete', fr, '']);
  if(dn) L.push(['− Desconto da nota', -dn, 'neg']);
  if(out) L.push([out>0 ? '+ Outras despesas / itens fora do filtro' : '− Outros descontos / ajustes', out, out<0?'neg':'']);
  return `<div class="sum">
    ${L.map(x=>`<div><span>${x[0]}</span><b class="${x[2]}">${R(x[1])}</b></div>`).join('')}
    <div class="tt"><span>${n.parcial ? '= Total dos grupos selecionados' : '= Total da nota'}</span><b>${R(n.v)}</b></div>
  </div>`;
}

function toast(t){
  const m = $('msg');
  m.textContent = t;
  m.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(()=>m.style.display='none', 2800);
}
function fb(t){
  try{
    const x = document.createElement('textarea');
    x.value = t; document.body.appendChild(x); x.select();
    const ok = document.execCommand('copy'); x.remove(); return ok;
  }catch(e){ return false; }
}
function copy(t){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(t).then(()=>true).catch(()=>fb(t));
  return Promise.resolve(fb(t));
}

function preset(p){
  const t = new Date(), a = new Date(t);
  let d1='', d2='';
  if(p==='hoje'){ d1 = d2 = ymd(t); }
  else if(p==='7' || p==='30'){ a.setDate(t.getDate()-(+p-1)); d1 = ymd(a); d2 = ymd(t); }
  else if(p==='mes'){ d1 = ymd(new Date(t.getFullYear(), t.getMonth(), 1)); d2 = ymd(t); }
  else if(p==='mesant'){
    d1 = ymd(new Date(t.getFullYear(), t.getMonth()-1, 1));
    d2 = ymd(new Date(t.getFullYear(), t.getMonth(), 0));
  }
  $('d1').value = d1; $('d2').value = d2;
  document.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  draw();
}

/* =================== PAINEL DE GRUPOS =================== */
function drawG(){
  const btn = $('gb');
  const on = !!selG;
  const ap = activePreset();
  const lbl = !on ? 'Todos' : ap ? ap : (gCount() === 0 ? 'nenhum' : `${gCount()} de ${allGroups.length}`);
  btn.textContent = `Grupos: ${lbl}${saveG ? ' 💾' : ''} ${$('gp').hidden ? '▾' : '▴'}`;
  btn.classList.toggle('on', on);
  document.querySelectorAll('[data-pre]').forEach(b => b.classList.toggle('on', b.dataset.pre === ap));

  if($('gp').hidden) return;

  const d1 = $('d1').value, d2 = $('d2').value;
  const cnt = {}, val = {};
  nfs.forEach(n=>{
    if((d1 && n.eni < d1) || (d2 && n.eni > d2)) return;
    n.it.forEach(x=>{
      const g = gName(x);
      cnt[g] = (cnt[g]||0) + 1;
      val[g] = (val[g]||0) + x.liq;
    });
  });

  const q = $('gq').value.trim().toLowerCase();
  gView = allGroups.filter(g => !q || g.toLowerCase().includes(q) || (gCode[g]||'').toLowerCase().includes(q));

  const box = $('gl'), sc = box.scrollTop;
  box.innerHTML = gView.length ? gView.map((g,i)=>{
    const c = cnt[g] || 0;
    return `<label class="gi${c?'':' z'}">
      <input type="checkbox" data-gi="${i}" ${(!selG || selG.has(g)) ? 'checked' : ''}>
      ${gCode[g] ? `<span class="cf">${esc(gCode[g])}</span>` : ''}
      <span class="gn">${esc(g)}</span>
      <span class="gc">${c} it. · ${R(val[g]||0)}</span>
    </label>`;
  }).join('') : '<div class="gempty">Nenhum grupo encontrado.</div>';
  box.scrollTop = sc;
}

/* =================== DRAW =================== */
function draw(){
  const q  = $('q').value.trim().toLowerCase();
  const d1 = $('d1').value, d2 =$('d2').value;

  const list = nfs.map(applyG).filter(n =>
    n &&
    (!d1 || n.eni >= d1) &&
    (!d2 || n.eni <= d2) &&
    (!q  || n.f.toLowerCase().includes(q) || n.nf.includes(q) ||
           (n.cf && n.cf.toLowerCase().includes(q)) ||
           n.it.some(x => x.desc.toLowerCase().includes(q) || x.cod.toLowerCase() === q))
  );

  const periodo = (d1||d2) ? `${fmtIso(d1)||'início'} a ${fmtIso(d2)||'hoje'}` : 'Todo o período';
  const phTitle = $('phTitle');

  drawG();

  if(groupMode === 'produto'){
    if(phTitle) phTitle.textContent = 'Compras consolidadas por produto';
    drawProduto(list, periodo, q);
  } else {
    if(phTitle) phTitle.textContent = 'Compras consolidadas por fornecedor';
    drawFornecedor(list, periodo, q);
  }
}

const kGrupos = () => selG ? [['Grupos filtrados', `${gCount()} de ${allGroups.length}`]] : [];

/* -------- Modo FORNECEDOR -------- */
function drawFornecedor(list, periodo, q){
  const g = {};
  list.forEach(n=>{
    let o = g[n.f];
    if(!o) o = g[n.f] = {f:n.f, cf:'', c:0, v:0, l:[]};
    if(!o.cf && n.cf) o.cf = n.cf;
    o.c++; o.v += n.v; o.l.push(n);
  });
  groups = Object.values(g).sort((a,b)=>b.v - a.v);
  const tot = groups.reduce((a,x)=>a+x.v, 0);

  $('thead').innerHTML =
    '<tr><th>Fornecedor</th><th class="n">Notas</th><th class="n">Total das NFs</th></tr>';

  $('k').innerHTML = [
    ['Período (entrada)', periodo],
    ...kGrupos(),
    ['Fornecedores', groups.length],
    ['Notas', list.length],
    [selG ? 'Total (grupos filtrados)' : 'Total das NFs', R(tot)]
  ].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');

  setPrintMeta('Por fornecedor', periodo, [
    ['Fornecedores', String(groups.length)],
    ['Notas fiscais', String(list.length)],
    [selG ? 'Total (grupos filtrados)' : 'Total das NFs', R(tot), 'hl wide']
  ], q);

  let h = '';
  groups.forEach((o,i)=>{
    const op = open.has(o.f);
    h += `<tr class="f" data-i="${i}">
      <td>
        <span class="a">${op?'▼':'▶'}</span>
        ${o.cf ? `<span class="cf">${esc(o.cf)}</span>` : ''}
        <span class="fname">${esc(o.f)}</span>
      </td>
      <td class="n">${o.c}</td>
      <td class="n">${R(o.v)}</td>
    </tr>`;
    if(op){
      o.l.slice().sort((a,b)=> b.eni.localeCompare(a.eni) || b.v - a.v).forEach(n=>{
        const j = n.idx, no = openNF.has(n.key);
        h += `<tr class="d" data-n="${j}">
          <td>
            <span class="a">${no?'▼':'▶'}</span>
            NF ${esc(n.nf)}${n.s?'/'+esc(n.s):''}
            · Pedido ${esc(n.ped)}
            · Emissão ${esc(n.em)}
            · <b>Entrada ${esc(n.en)}</b>
            · ${n.it.length} it.
            ${n.parcial ? '· <span class="gr-tag">só grupos filtrados</span>' : ''}
          </td>
          <td class="n" colspan="2">${R(n.v)} &nbsp; ${
            n.ch
              ? `<button class="s" data-c="${j}">Copiar chave</button> <button class="s" data-m="${j}">Consultar no Meu DANFE</button>`
              : '<span style="color:#8a94a3" class="no-print">sem chave</span>'
          }</td>
        </tr>`;
        h += `<tr class="rs"><td colspan="3">${resumo(n)}</td></tr>`;
        if(no) h += `<tr class="it"><td colspan="3">${itemsHTML(n)}</td></tr>`;
      });
    }
  });
  $('tb').innerHTML = h || '<tr><td colspan="3" style="color:#8a94a3">Nenhuma nota nesse filtro.</td></tr>';
  $('tf').innerHTML = `<tr><td>TOTAL GERAL</td><td class="n">${list.length}</td><td class="n">${R(tot)}</td></tr>`;
}

/* -------- Modo PRODUTO -------- */
function drawProduto(list, periodo, q){
  const g = {};
  const usedNFs = new Set();

  list.forEach(n=>{
    n.it.forEach(it=>{
      if(q && !it.desc.toLowerCase().includes(q) && it.cod.toLowerCase() !== q) return;
      usedNFs.add(n.key);
      const key = it.cod || it.desc;
      let o = g[key];
      if(!o) o = g[key] = {
        cod:it.cod, desc:it.desc, un:it.un, gr:it.gr, cg:it.cg,
        qtd:0, vt:0, liq:0, icms:0, ipi:0, fr:0, dc:0, nfs:[]
      };
      o.qtd += it.qtd;
      o.vt  += it.vt;
      o.liq += it.liq;
      o.icms+= it.icms;
      o.ipi += it.ipi;
      o.fr  += it.fr;
      o.dc  += it.dc;
      o.nfs.push({n, it});
    });
  });

  groups = Object.values(g).sort((a,b)=>b.liq - a.liq);

  const totQ   = groups.reduce((a,x)=>a+x.qtd, 0);
  const totLiq = groups.reduce((a,x)=>a+x.liq, 0);
  const totNFs = list.reduce((a,n)=>a+n.v, 0);        /* MESMO valor do modo fornecedor */
  const ajuste = totNFs - totLiq;                     /* IPI + frete − descontos         */
  const nForns = new Set(list.filter(n=>usedNFs.has(n.key)).map(n=>n.f)).size;

  $('thead').innerHTML =
    '<tr><th>Produto</th><th class="n">Qtd total</th><th class="n">Valor líquido</th></tr>';

  $('k').innerHTML = [
    ['Período (entrada)', periodo],
    ...kGrupos(),
    ['Produtos', groups.length],
    ['Fornecedores', nForns],
    ['Notas', usedNFs.size],
    [selG ? 'Total (grupos filtrados)' : 'Total das NFs', R(totNFs)],
    ['Total dos produtos (líquido)', R(totLiq)],
    ['Ajustes (IPI / frete / desc.)', R(ajuste)]
  ].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');

  setPrintMeta('Por produto', periodo, [
    ['Produtos', String(groups.length)],
    ['Fornecedores', String(nForns)],
    ['Notas fiscais', String(usedNFs.size)],
    ['Total dos produtos (líquido)', R(totLiq)],
    ['Ajustes (IPI / frete / desc.)', R(ajuste)],
    [selG ? 'Total (grupos filtrados)' : 'Total das NFs', R(totNFs), 'hl']
  ], q);

  let h = '';
  groups.forEach((o,i)=>{
    const key = 'p:' + (o.cod || o.desc);
    const op = open.has(key);
    h += `<tr class="f" data-i="${i}">
      <td>
        <span class="a">${op?'▼':'▶'}</span>
        ${o.cod ? `<span class="cf">${esc(o.cod)}</span>` : ''}
        <span class="fname">${esc(o.desc)}</span>
        ${o.gr ? `<span class="gr-tag">· ${o.cg ? esc(o.cg)+' ' : ''}${esc(o.gr)}</span>` : ''}
      </td>
      <td class="n">${N3(o.qtd)}${o.un?' '+esc(o.un):''}</td>
      <td class="n">${R(o.liq)}</td>
    </tr>`;

    if(op){
      o.nfs.slice()
        .sort((a,b)=> b.n.eni.localeCompare(a.n.eni) || b.it.liq - a.it.liq)
        .forEach(({n, it})=>{
          h += `<tr class="d">
            <td>
              <span class="a">·</span>
              ${n.cf ? `<span class="cf">${esc(n.cf)}</span> ` : ''}${esc(n.f)}
              &middot; NF ${esc(n.nf)}${n.s?'/'+esc(n.s):''}
              &middot; Pedido ${esc(n.ped)}
              &middot; <b>Entrada ${esc(n.en)}</b>
            </td>
            <td class="n">${N3(it.qtd)}${it.un?' '+esc(it.un):''}</td>
            <td class="n">${R(it.liq)}</td>
          </tr>`;
        });

      h += `<tr class="sub">
        <td><span class="a"></span>Subtotal · ${o.nfs.length} nota${o.nfs.length>1?'s':''}</td>
        <td class="n">${N3(o.qtd)}${o.un?' '+esc(o.un):''}</td>
        <td class="n">${R(o.liq)}</td>
      </tr>`;
    }
  });

  $('tb').innerHTML = h || '<tr><td colspan="3" style="color:#8a94a3">Nenhum produto nesse filtro.</td></tr>';

  /* ---- Rodapé com reconciliação: produtos + ajustes = Total das NFs ---- */
  $('tf').innerHTML = `<tr><td colspan="3" style="border:0;padding:0">
    <div class="sum" style="margin:10px 0 10px auto">
      <div><span>Total dos produtos (soma das linhas)</span><b>${R(totLiq)}</b></div>
      ${Math.abs(ajuste) > 0.01
        ? `<div><span>+ Ajustes (IPI / frete / descontos da nota)</span><b>${R(ajuste)}</b></div>`
        : ''}
      <div class="tt"><span>= Total das NFs (${usedNFs.size} nota${usedNFs.size>1?'s':''})</span><b>${R(totNFs)}</b></div>
    </div>
  </td></tr>`;
}

/* =================== FETCH =================== */
async function getCSV(){
  const u = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
  try{
    const r = await fetch(u); if(!r.ok) throw 0; return await r.text();
  }catch(e){
    const r = await fetch('/api/csv?_=' + Date.now());
    if(!r.ok) throw new Error('Não consegui ler a planilha (verifique se está publicada como CSV).');
    return await r.text();
  }
}

async function load(){
  $('st').className = '';$('st').textContent = 'Carregando planilha...';
  try{
    build(parseCSV(await getCSV()));
    const maxD = nfs.reduce((m,n)=> n.eni > m ? n.eni : m, '');
    $('st').textContent = `${nfs.length} notas carregadas · última entrada na planilha: ${fmtIso(maxD)} · atualizado às ${new Date().toLocaleTimeString('pt-BR')}`;
    draw();
  }catch(e){
    $('st').className = 'err';$('st').textContent = 'Erro: ' + e.message;
  }
}

/* ---------- Expansão em lote ---------- */
function expandAll(){
  if(groupMode === 'produto'){
    groups.forEach(g => open.add('p:' + (g.cod || g.desc)));
  } else {
    groups.forEach(g => {
      open.add(g.f);
      g.l.forEach(n => openNF.add(n.key));
    });
  }
  draw();
}
function collapseAll(){
  open.clear(); openNF.clear(); draw();
}

/* ---------- Impressão ---------- */
/* Define a orientação da página: retrato p/ resumo, paisagem p/ detalhamento */
function setPage(orient){
  let s = $('pgs');
  if(!s){ s = document.createElement('style'); s.id = 'pgs'; document.head.appendChild(s); }
  s.textContent = `@page{size:A4 ${orient};margin:14mm 12mm 16mm}`;
}

function printMode(pmode){
  const savedOpen   = new Set(open);
  const savedOpenNF = new Set(openNF);

  const restore = () => {
    open.clear();   savedOpen.forEach(x=>open.add(x));
    openNF.clear(); savedOpenNF.forEach(x=>openNF.add(x));
    draw();
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  setTimeout(restore, 60000); // fallback

  if(pmode === 'summary'){
    setPage('portrait');
    open.clear(); openNF.clear();
    draw();
    setTimeout(()=>window.print(), 80);
  } else {
    setPage('landscape');
    expandAll();
    setTimeout(()=>window.print(), 80);
  }
}

/* ---------- Eventos ---------- */
$('tb').onclick = e => {
  const bc = e.target.closest('[data-c]');
  const bm = e.target.closest('[data-m]');
  if(bc){
    const n = nfs[bc.dataset.c];
    copy(n.ch).then(ok => toast(ok ? 'Chave copiada!' : 'Chave: ' + n.ch));
    return;
  }
  if(bm){
    const n = nfs[bm.dataset.m];
    copy(n.ch).then(ok=>{
      toast(ok ? 'Chave copiada! Cole no Meu DANFE' : 'Chave: ' + n.ch);
      window.open('https://www.meudanfe.com.br/', '_blank', 'noopener');
    });
    return;
  }
  if(e.target.closest('tr.it') || e.target.closest('tr.rs') || e.target.closest('tr.sub')) return;

  /* NF detalhada dentro de fornecedor */
  const rn = e.target.closest('tr.d[data-n]');
  if(rn){
    const n = nfs[rn.dataset.n];
    openNF.has(n.key) ? openNF.delete(n.key) : openNF.add(n.key);
    draw(); return;
  }

  /* Linha de grupo (fornecedor OU produto) */
  const r = e.target.closest('tr.f');
  if(!r) return;
  const item = groups[r.dataset.i];
  let key;
  if(groupMode === 'produto') key = 'p:' + (item.cod || item.desc);
  else key = item.f;

  open.has(key) ? open.delete(key) : open.add(key);
  draw();
};

document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => preset(b.dataset.p));
['d1','d2'].forEach(i => $(i).oninput = () => {
  document.querySelectorAll('[data-p]').forEach(b => b.classList.remove('on'));
  draw();
});
$('q').oninput = draw;
$('rf').onclick = load;

$('ea').onclick = expandAll;
$('ca').onclick = collapseAll;

$('pc').onclick = () => printMode('details');$('ps').onclick = () => printMode('summary');

document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
  groupMode = b.dataset.g;
  document.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x.dataset.g === groupMode));
  open.clear(); openNF.clear();
  draw();
});

/* ---- Painel de grupos ---- */
$('gb').onclick = () => {
  const p = $('gp');
  p.hidden = !p.hidden;
  $('gb').setAttribute('aria-expanded', String(!p.hidden));
  drawG();
};
Object.keys(GRUPO_PRESETS).forEach(nome => {
  const b = document.createElement('button');
  b.className = 's'; b.textContent = nome; b.dataset.pre = nome;
  b.onclick = () => applyPreset(nome);
  $('gpre').appendChild(b);
});
$('gq').oninput = drawG;
$('gl').onchange = e => {
  const cb = e.target.closest('[data-gi]');
  if(!cb) return;
  const g = gView[+cb.dataset.gi];
  const s = curG();
  cb.checked ? s.add(g) : s.delete(g);
  setSel(s);
};
$('gAll').onclick  = () => { const s = curG(); gView.forEach(g => s.add(g));    setSel(s); };
$('gNone').onclick = () => { const s = curG(); gView.forEach(g => s.delete(g)); setSel(s); };
$('gInv').onclick  = () => { const s = curG(); gView.forEach(g => s.has(g) ? s.delete(g) : s.add(g)); setSel(s); };
$('gSave').onchange = e => {
  saveG = e.target.checked;
  persistG();
  drawG();
  toast(saveG ? 'Seleção de grupos salva neste navegador' : 'Seleção de grupos não será mais lembrada');
};

/* ---------- Boot ---------- */
loadG();
$('gSave').checked = saveG;
document.querySelectorAll('[data-p]').forEach(b =>
  b.classList.toggle('on', b.dataset.p === DEFAULT_PRESET));
document.querySelectorAll('[data-g]').forEach(b =>
  b.classList.toggle('on', b.dataset.g === DEFAULT_GROUP));

load().then(()=>preset(DEFAULT_PRESET));
</script>
